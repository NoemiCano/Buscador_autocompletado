<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de destinos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="cabecera">
        <h1>Mis Viajes</h1>
    </header>

    <main class="contenedor">
        <div class="buscador">
            <label for="entrada">Indica el destino</label>
            <input type="text" id="entrada" placeholder="¿Adónde vas?" autocomplete="off">
            <ul id="sugerencias"></ul>
            <p id="seleccion"></p>
        </div>
    </main>

    <script src="script.js" type="module"></script>
</body>
</html>
